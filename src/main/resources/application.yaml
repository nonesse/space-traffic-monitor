spring:
  application:
    name: space-traffic-monitor

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092

    listener:
      auto-startup: true

    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    consumer:
      group-id: space-traffic-group
      auto-offset-reset: earliest

springdoc:
  swagger-ui:
    url: openapi/space-traffic-api.yaml
    disable-swagger-default-url: true

logging:
  level:
    root: INFO
    com.spacetraffic.monitor: DEBUG
    org.springframework.kafka: DEBUG
    org.apache.kafka.clients.consumer: INFO